site_name: ioc Guide
site_description: Annotation-driven Go IoC through static code generation
site_url: !ENV [DOCS_SITE_URL, "https://longxi-go.github.io/ioc/"]
site_author: The longxi-go/ioc Authors
repo_name: longxi-go/ioc
repo_url: https://github.com/longxi-go/ioc
copyright: Copyright &copy; 2026 - present The longxi-go/ioc Authors

watch:
  - ../../examples/gin/README.md
  - ../../examples/gin/README.zh_CN.md
  - ../../examples/coffee/docs/integration.md
  - ../../examples/coffee/docs/integration.zh_CN.md

validation:
  links:
    anchors: warn

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  icon:
    logo: material/code-braces
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      # Use bundled English search with Han boundaries; avoid a remote tokenizer.
      reconfigure_search: false
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: ioc 使用手册
          site_description: 根据 Go 注释中的注解生成依赖注入与生命周期代码
          nav:
            - 概览: index.md
            - 开始使用:
                - 快速开始: quick-start.md
                - 注解参考: annotations.md
                - Environment: environment.md
            - 示例:
                - 示例索引: examples/index.md
                - Gin 请求作用域: examples/gin.md
                - Coffee MVC 应用: examples/coffee.md
            - 项目维护:
                - 架构: architecture.md
                - 事件: events.md
                - 开发指南: development.md
          theme:
            language: zh
  - search:
      lang: en
      separator: '[\s\-]+|(?=[\u4e00-\u9fff])|(?<=[\u4e00-\u9fff])'
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir/../..
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/ecosystem.css

extra:
  generator: false

nav:
  - Overview: index.md
  - Getting Started:
      - Quick Start: quick-start.md
      - Annotation Reference: annotations.md
      - Environment: environment.md
  - Examples:
      - Example Index: examples/index.md
      - Gin Request Scopes: examples/gin.md
      - Coffee MVC Application: examples/coffee.md
  - Project:
      - Architecture: architecture.md
      - Events: events.md
      - Development: development.md

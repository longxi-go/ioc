name: Docs Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to deploy (vX.Y.Z)
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build published release documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out released source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: release-source
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Require the current published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py --root release-source --tag "$RELEASE_TAG" \
            --check-github --repository "$GITHUB_REPOSITORY"
          commit=$(git -C release-source rev-parse HEAD)
          python3 scripts/publish_release.py --root release-source \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$commit" --require-latest
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: release-source/docs/design/uv.lock
      - name: Build documentation from released source
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/
        working-directory: release-source
        run: make docs-build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: release-source/docs/design/site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          path: release-source
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Recheck Latest before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          python3 scripts/publish_release.py --root release-source \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --require-latest
      - name: Deploy released site
        id: deployment
        uses: actions/deploy-pages@v5
